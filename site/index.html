    <script>(function(){try{var t=null;try{t=localStorage.getItem("ohms:theme")}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark"}document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name="theme-color"]');if(m){m.setAttribute("content",t==="light"?"#F4F8FF":"#04070E")}}catch(e){document.documentElement.setAttribute("data-theme","dark")}})();</script>
