<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- OhMyShark (OMSK) vector emblem: deep ocean tile with front-facing hammerhead shark -->
  <defs>
    <linearGradient id="ocean" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#074463"/>
      <stop offset="0.55" stop-color="#061f38"/>
      <stop offset="1" stop-color="#040b18"/>
    </linearGradient>
    <linearGradient id="sharkBody" x1="512" y1="290" x2="512" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1967d2"/>
      <stop offset="1" stop-color="#083d8c"/>
    </linearGradient>
    <linearGradient id="sharkBelly" x1="512" y1="540" x2="512" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9cc0ee"/>
      <stop offset="1" stop-color="#6b9bd9"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#ocean)"/>
  <path d="M180 64L340 64L210 420L120 420Z" fill="#38bdf8" fill-opacity="0.08"/>
  <path d="M400 64L590 64L430 480L290 480Z" fill="#38bdf8" fill-opacity="0.1"/>
  <!-- Dorsal fin -->
  <path d="M512 280L422 500H602L512 280Z" fill="url(#sharkBody)" stroke="#7cc4ff" stroke-opacity="0.45" stroke-width="6" stroke-linejoin="round"/>
  <!-- Pectoral fins -->
  <path d="M360 510C285 560 225 630 225 670C225 690 250 675 295 635L390 580Z" fill="#0d4db2" stroke="#7cc4ff" stroke-opacity="0.4" stroke-width="5" stroke-linejoin="round"/>
  <path d="M664 510C739 560 799 630 799 670C799 690 774 675 729 635L634 580Z" fill="#0d4db2" stroke="#7cc4ff" stroke-opacity="0.4" stroke-width="5" stroke-linejoin="round"/>
  <!-- Belly -->
  <ellipse cx="512" cy="595" rx="165" ry="75" fill="url(#sharkBelly)" stroke="#b6d8ff" stroke-opacity="0.55" stroke-width="5"/>
  <!-- Hammerhead bridge -->
  <rect x="330" y="455" width="364" height="115" rx="34" fill="url(#sharkBody)" stroke="#7cc4ff" stroke-opacity="0.45" stroke-width="5"/>
  <!-- Left & Right cephalofoil lobes -->
  <rect x="236" y="388" width="170" height="224" rx="82" fill="#093f94" stroke="#7cc4ff" stroke-opacity="0.5" stroke-width="5"/>
  <rect x="618" y="388" width="170" height="224" rx="82" fill="#093f94" stroke="#7cc4ff" stroke-opacity="0.5" stroke-width="5"/>
  <circle cx="321" cy="510" r="50" fill="#0077ff" fill-opacity="0.35"/>
  <circle cx="703" cy="510" r="50" fill="#0077ff" fill-opacity="0.35"/>
  <rect x="64" y="64" width="896" height="896" rx="200" stroke="#7cc4ff" stroke-opacity="0.18" stroke-width="4"/>
</svg>
